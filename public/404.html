<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Kinetiq Money</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('pulse_theme') || 'dark';
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(savedTheme);
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FAFAFA] dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-zinc-800 selection:text-white p-6">

  <!-- TOP BRAND NAV -->
  <header class="max-w-4xl w-full mx-auto flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 flex items-center justify-center font-bold text-sm shadow-sm">
        <i data-lucide="wallet" class="w-4 h-4"></i>
      </div>
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-100 leading-none">Kinetiq Money</h1>
        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-700">
          404
        </span>
      </div>
    </a>

    <!-- Theme Toggle -->
    <button onclick="toggleTheme()" class="p-2 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </header>

  <!-- 404 MAIN CONTENT -->
  <main class="max-w-md w-full mx-auto text-center space-y-6 my-auto">
    <!-- Visual Floating Badge -->
    <div class="relative inline-flex items-center justify-center">
      <div class="w-24 h-24 rounded-3xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 flex items-center justify-center text-zinc-900 dark:text-white shadow-2xl animate-float">
        <i data-lucide="compass" class="w-10 h-10 text-zinc-400 dark:text-zinc-500"></i>
      </div>
      <div class="absolute -bottom-2 -right-2 px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-500 border border-rose-500/20 text-[10px] font-bold uppercase tracking-wider">
        Lost Flow
      </div>
    </div>

    <!-- Headlines -->
    <div class="space-y-2">
      <h2 class="text-3xl font-bold tracking-tight text-zinc-900 dark:text-white">Page Not Found</h2>
      <p class="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed max-w-sm mx-auto">
        The financial node or resource you requested does not exist or has been relocated.
      </p>
    </div>

    <!-- Quick Navigation Actions -->
    <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/" class="w-full sm:w-auto px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-900 text-xs font-semibold rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-95">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Return to Dashboard</span>
      </a>

      <a href="https://ai-expense-tracker-o5a3.onrender.com" class="w-full sm:w-auto px-4 py-2.5 bg-zinc-100 dark:bg-zinc-900 hover:bg-zinc-200 dark:hover:bg-zinc-800 border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95">
        <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
        <span>Live Overview</span>
      </a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="max-w-4xl w-full mx-auto text-center text-zinc-400 text-xs py-4">
    Kinetiq Money Financial OS &copy; 2026. All systems secure.
  </footer>

  <script>
    lucide.createIcons();

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('pulse_theme', 'light');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('pulse_theme', 'dark');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
